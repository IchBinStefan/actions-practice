# This config was automatically generated from your source code
# Stacks detected: cicd:github-actions:.github/workflows,deps:node:.,test:jest:

version: 2.1

orbs:
  node: circleci/node@5
  docker: circleci/docker@4.0.1

executors:
  linux:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
  macos:
    macos:
      xcode: '27.0.0'

jobs:
  format-and-lint:
    description: Check Format and Lint Rules
    executor:
      name: node/default
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Install Dependencies
          command: npm ci
      - run:
          name: Run Linter Check
          command: npm run lint
      - run:
          name: Run Formatter Check
          command: npm run format:check

  run-tests:
    description: Run Unit Tests
    executor:
      name: node/default
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Install Dependencies
          command: npm ci
      - run:
          name: Run Unit Tests
          environment:
            NODE_ENV: test
          command: npm test

  smoke-test:
    description: Smoke Test the Application
    parameters:
      node:
        type: string
        default: '24.11.0'
      os:
        type: string
        enum: ['linux', 'macos']
      server-port:
        type: string
        default: '3000'
    executor: << parameters.os >>
    steps:
      - checkout
      - node/install:
          node-version: << parameters.node >>
      - run:
          name: Install Dependencies
          command: npm ci
      - run:
          name: Start Express Server and Health Check
          command: |
            npm start & echo $! > server.pid
            sleep 5
            curl \
              --fail \
              --retry 15 \
              --retry-delay 1 \
              --retry-connrefused \
              "http://localhost:<< parameters.server-port >>/health"
      - run:
          name: Server Cleanup
          when: always
          command: |
            if [ -f server.pid ]; then
              kill -15 "$(cat server.pid)" &>/dev/null || true
              rm -f server.pid
            fi

  build-test-push-image:
    description: Build, Test, and Push the OCI Image to GHCR
    executor: docker/docker
    steps:
      - checkout
      - setup_remote_docker
      - docker/check:
          registry: ghcr.io
          docker_username: GHCR_USERNAME
          docker_password: GHCR_PASSWORD
      - docker/build:
          docker_context: .
          dockerfile: Dockerfile
          image: ghcr.io/${GHCR_USERNAME}/actions-practice
          tag: latest-circle
      - run:
          name: Test Docker Container
          command: |
            docker run -d \
              --name test-container \
              -p 3000:3000 \
              ghcr.io/${GHCR_USERNAME}/actions-practice:latest-circle
            sleep 5
            docker exec test-container curl --fail "http://localhost:3000/health"
      - run:
          name: Cleanup Test Container
          when: always
          command: docker rm -f test-container || true
      - docker/push:
          registry: ghcr.com
          image: ghcr.io/${GHCR_USERNAME}/actions-practice
          tag: latest-circle
      - run:
          name: Logout out of GHCR
          when: always
          command: docker logout ghcr.io || true
      - run:
          name: Cleanup Docker Objects
          when: always
          command: docker system prune -af --volumes

workflows:
  version: 2
  facultatea-de-instalatii:
    jobs:
      - format-and-lint
      - run-tests
      - smoke-test:
          requires:
            - format-and-lint
            - run-tests
          matrix:
            parameters:
              os: ['linux', 'macos']
      - approve-ghcr-push:
          type: approval
          requires:
            - smoke-test
      - build-test-push-image:
          context: ghcr-credentials
          requires:
            - approve-ghcr-push
