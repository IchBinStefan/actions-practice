name: Smoke Test Checks

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '20'
      server-port:
        required: false
        type: number
        default: 3000

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Start Express Server
        run: |
          npm start &

      - name: Health Endpoint Check
        run: |
          curl \
            --fail \
            --retry 15 \
            --retry-delay 1 \
            "http://localhost:${{ inputs.server-port }}/health"
