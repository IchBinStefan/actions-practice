name: Smoke Test Checks

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '20'
      server-port:
        required: false
        type: number
        default: 3000

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start Express Server
        run: |
          npm start & echo $! > server.pid

      - name: Health Endpoint Check
        run: |
          curl \
            --fail \
            --retry 15 \
            --retry-delay 1 \
            "http://localhost:${{ inputs.server-port }}/health"

      - name: Server Cleanup
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill -15 "$(cat server.pid)" &>/dev/null || true
            rm -f server.pid
          fi
